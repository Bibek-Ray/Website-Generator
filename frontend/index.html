<!DOCTYPE html>
<html>
<head>
  <title>Website Generator</title>
  <link rel="stylesheet" href="./static/styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-content">
      <span class="logo">WebGen</span>
    </div>
  </nav>

  <div id="container">
    <h1>Website Generator</h1>
    <div id="inputArea">
      <textarea id="userQuery" rows="6" placeholder="Describe your website..."></textarea>
      <button id="sendBtn">Generate Website</button>
    </div>
    <div id="resultArea"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>Developed with ❤️ by <a href="https://github.com/Bibek-Ray" target="_blank" class="github-link">Bibek</a></p>
  </footer>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const userQuery = document.getElementById("userQuery");
    const resultArea = document.getElementById("resultArea");

    sendBtn.addEventListener("click", async () => {
      resultArea.innerHTML = `
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
        <p class="generating-text">Generating your website...</p>
      `;
      
      const query = userQuery.value.trim();
      if (!query) {
        resultArea.innerHTML = "<p>Please enter your website requirements.</p>";
        return;
      }
      
      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_prompt: query })
        });
        
        if (!response.ok) throw new Error("Error generating website");
        
        const data = await response.json();
        const htmlBlob = new Blob([data.html], { type: 'text/html' });
        const cssBlob = new Blob([data.css], { type: 'text/css' });
        
        resultArea.innerHTML = `
          <p class="success-text">Website generated successfully!</p>
          <div class="download-buttons">
            <a class="download-btn" href="${URL.createObjectURL(htmlBlob)}" download="index.html">
              <span class="material-icons">download</span>
              HTML File
            </a>
            <a class="download-btn" href="${URL.createObjectURL(cssBlob)}" download="styles.css">
              <span class="material-icons">download</span>
              CSS File
            </a>
          </div>
        `;
      } catch (error) {
        resultArea.innerHTML = `<p class="error-text">Error: ${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
